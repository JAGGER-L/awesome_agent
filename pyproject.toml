[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "awesome-agent"
dynamic = ["version"]
description = "AI coding agent for the terminal."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "JAGGER-L"}]
dependencies = [
  "httpx>=0.28,<1",
  "jsonschema>=4.26,<5",
  "langgraph>=1.2.9",
  "langgraph-checkpoint-sqlite>=3.1.0",
  "mcp>=1,<2",
  "openai>=1.100",
  "pydantic>=2.11,<3",
  "python-dotenv>=1.1,<2",
  "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
memory = [
  "mem0ai>=2.0.7,<3",
]

[project.scripts]
awesome-core = "awesome_agent.protocol.stdio:main"
awesome-dev = "awesome_agent.development.launcher:main"

[dependency-groups]
dev = [
  "hatchling==1.31.0",
  "mypy>=1.17",
  "pip-audit>=2.10.1,<3",
  "pytest>=8.4",
  "pytest-asyncio>=1.1",
  "pytest-cov>=6.2",
  "ruff>=0.12",
  "types-jsonschema>=4.26,<5",
  "types-PyYAML>=6.0.12.20250516",
]

[tool.hatch.build.targets.wheel]
packages = ["src/awesome_agent"]

[tool.hatch.build]
artifacts = ["src/awesome_agent/extensions/skills/bundled/**"]

[tool.hatch.version]
path = "VERSION"
pattern = "^(?P<version>[0-9]+\\.[0-9]+\\.[0-9]+)$"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["mem0", "mem0.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --import-mode=importlib"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: crosses a target local component or persistence boundary",
  "e2e: exercises a complete target user-facing workflow",
  "external: requires explicit credentials or network access and is excluded from the default local gate",
]

[tool.coverage.run]
branch = true
source = ["awesome_agent"]

[tool.coverage.report]
fail_under = 80
show_missing = true
