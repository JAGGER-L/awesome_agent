name: Release gate

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  checks: read
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-verify:
    name: Build and verify release bundle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release revision
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
          if test "${GITHUB_EVENT_NAME}" = "push"; then
            test "${GITHUB_REF_TYPE}" = "tag"
            test "${GITHUB_REF_NAME}" = "v${version}"
          else
            test "${GITHUB_REF}" = "refs/heads/main"
          fi

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify release identity
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if test "${GITHUB_EVENT_NAME}" = "push"; then
            policy="current"
          else
            policy="absent"
          fi
          python scripts/release/check_identity.py \
            --tag-policy "${policy}" \
            --require-check-runs \
            --github-repository "${GITHUB_REPOSITORY}" \
            --github-sha "${GITHUB_SHA}"

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: tui/package-lock.json

      - name: Install locked dependencies
        run: |
          uv sync --locked --extra memory --dev
          npm --prefix tui ci

      - name: Re-run deterministic release gate
        run: |
          uv lock --check
          uv run ruff format --check src tests scripts
          uv run ruff check src tests scripts
          uv run mypy src tests scripts
          uv run --extra memory pytest -q tests
          uv run python scripts/generate_protocol_fixtures.py --check
          npm --prefix tui run version:check
          npm --prefix tui run format:check
          npm --prefix tui run lint
          npm --prefix tui run typecheck
          npm --prefix tui test
          npm --prefix tui run build
          requirements="${RUNNER_TEMP}/awesome-requirements.txt"
          uv export --locked --extra memory --no-dev --no-emit-project \
            --format requirements.txt --output-file "${requirements}"
          uv run pip-audit --require-hashes \
            --progress-spinner off --timeout 20 --vulnerability-service pypi \
            --requirement "${requirements}"
          uv run pip-audit --require-hashes --disable-pip \
            --progress-spinner off --timeout 20 --vulnerability-service osv \
            --requirement "${requirements}"
          npm --prefix tui audit --package-lock-only --audit-level=high
          npm pack ./tui --dry-run

      - name: Build release bundle once
        run: uv run python scripts/release/build_bundle.py

      - name: Verify release bundle
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          uv run python scripts/release/verify_bundle.py \
            "dist/release/awesome-${version}.zip" "${version}"

      - name: Upload verified artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: awesome-release-${{ github.sha }}
          path: |
            dist/release/install.sh
            dist/release/install.ps1
            dist/release/awesome-*.zip
            dist/release/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  verify-release:
    name: Verify release bundle (${{ matrix.os }})
    needs: build-and-verify
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: tui/package-lock.json

      - name: Download the build-once artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: awesome-release-${{ github.sha }}
          path: dist/release

      - name: Install locked verification dependencies
        run: uv sync --locked --extra memory --dev

      - name: Verify the downloaded release bundle
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          uv run python scripts/release/verify_bundle.py \
            "dist/release/awesome-${version}.zip" "${version}"

  attest-release:
    name: Attest tagged release bundle
    if: github.event_name == 'push'
    needs: [build-and-verify, verify-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download verified artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: awesome-release-${{ github.sha }}
          path: dist/release

      - name: Verify downloaded asset checksums
        working-directory: dist/release
        shell: bash
        run: sha256sum --check --strict SHA256SUMS

      - name: Attest release provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-checksums: dist/release/SHA256SUMS
